<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Twitter</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 16px;
        }

        header {
            width: 100%;
            max-width: 600px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header svg { color: #1d9bf0; }

        header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #0f1419;
        }

        .composer {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 8px rgba(0,0,0,.08);
            padding: 20px;
            width: 100%;
            max-width: 600px;
        }

        .composer-inner {
            display: flex;
            gap: 12px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #1d9bf0;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .composer-body { flex: 1; }

        textarea {
            width: 100%;
            border: none;
            outline: none;
            resize: none;
            font-size: 1.1rem;
            line-height: 1.5;
            color: #0f1419;
            font-family: inherit;
            min-height: 100px;
            background: transparent;
        }

        textarea::placeholder { color: #536471; }

        .composer-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 14px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eff3f4;
        }

        .counter-ring {
            position: relative;
            width: 36px;
            height: 36px;
            flex-shrink: 0;
        }

        .counter-ring svg {
            transform: rotate(-90deg);
        }

        .counter-ring .track {
            fill: none;
            stroke: #eff3f4;
            stroke-width: 3;
        }

        .counter-ring .progress {
            fill: none;
            stroke: #1d9bf0;
            stroke-width: 3;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.15s ease, stroke 0.15s ease;
        }

        .counter-label {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 600;
            color: #536471;
            transition: color 0.15s ease;
        }

        .counter-label.warn  { color: #f4a118; }
        .counter-label.danger { color: #f4212e; }

        button[type="submit"] {
            background: #1d9bf0;
            color: #fff;
            border: none;
            border-radius: 999px;
            padding: 10px 22px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s ease, opacity 0.15s ease;
        }

        button[type="submit"]:hover:not(:disabled) { background: #1a8cd8; }

        button[type="submit"]:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ---- warning banner ---- */
        .limit-banner {
            display: none;
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .limit-banner.warn   { display: block; background: #fff8e1; color: #b36200; }
        .limit-banner.danger { display: block; background: #fdecea; color: #c0392b; }

        /* ---- feed ---- */
        .feed {
            width: 100%;
            max-width: 600px;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .post-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 1px 3px rgba(0,0,0,.10);
            padding: 18px 20px;
            display: flex;
            gap: 12px;
            animation: slideIn 0.25s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .post-card .avatar { background: #0ea5e9; font-size: 0.95rem; }

        .post-meta { font-size: 0.82rem; color: #536471; margin-bottom: 4px; font-weight: 500; }

        .post-text { color: #0f1419; font-size: 1rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }

        .no-posts { text-align: center; color: #536471; font-size: 0.95rem; padding: 24px 0; }
    </style>
</head>
<body>

<header>
    <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.73-8.835L1.254 2.25H8.08l4.253 5.622 5.911-5.622Zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
    </svg>
    <h1>Basic Twitter</h1>
</header>

<div class="composer">
    <form th:action="@{/post}" method="post" id="postForm">
        <div class="composer-inner">
            <div class="avatar" aria-hidden="true">Y</div>
            <div class="composer-body">
                <textarea
                    id="tweetBox"
                    name="content"
                    placeholder="What's happening?"
                    maxlength="200"
                    rows="4"
                    aria-label="Compose post"
                    aria-describedby="charCounter"
                ></textarea>
            </div>
        </div>

        <div id="limitBanner" class="limit-banner" role="alert"></div>

        <div class="composer-footer">
            <!-- circular progress ring -->
            <div class="counter-ring" aria-hidden="true">
                <svg width="36" height="36" viewBox="0 0 36 36">
                    <circle class="track"    cx="18" cy="18" r="15"/>
                    <circle class="progress" cx="18" cy="18" r="15"
                            stroke-dasharray="94.25"
                            stroke-dashoffset="94.25"
                            id="ringProgress"/>
                </svg>
                <span class="counter-label" id="charCounter">200</span>
            </div>

            <button type="submit" id="submitBtn" disabled>Post</button>
        </div>
    </form>
</div>

<section class="feed" aria-label="Posts">
    <div th:if="${posts.isEmpty()}" class="no-posts">No posts yet. Be the first!</div>
    <article th:each="post : ${posts}" class="post-card">
        <div class="avatar" aria-hidden="true">Y</div>
        <div>
            <div class="post-meta">You &middot; just now</div>
            <p class="post-text" th:text="${post}"></p>
        </div>
    </article>
</section>

<script>
    const MAX = 200;
    const WARN_THRESHOLD  = 0.8;   // 80% → yellow
    const LIMIT_THRESHOLD = 0.9;   // 90% → red

    const textarea   = document.getElementById('tweetBox');
    const counter    = document.getElementById('charCounter');
    const ring       = document.getElementById('ringProgress');
    const submitBtn  = document.getElementById('submitBtn');
    const banner     = document.getElementById('limitBanner');

    const CIRCUMFERENCE = 2 * Math.PI * 15; // 94.25

    function update() {
        const used     = textarea.value.length;
        const remaining = MAX - used;
        const ratio    = used / MAX;
        const offset   = CIRCUMFERENCE * (1 - ratio);

        // ring
        ring.style.strokeDashoffset = offset;

        // colour states
        if (ratio >= 1) {
            ring.style.stroke  = '#f4212e';
            counter.className  = 'counter-label danger';
            counter.textContent = '0';
            banner.className   = 'limit-banner danger';
            banner.textContent = 'Character limit reached (200/200).';
        } else if (ratio >= LIMIT_THRESHOLD) {
            ring.style.stroke  = '#f4212e';
            counter.className  = 'counter-label danger';
            counter.textContent = remaining;
            banner.className   = 'limit-banner danger';
            banner.textContent = `Almost there — only ${remaining} character${remaining === 1 ? '' : 's'} left!`;
        } else if (ratio >= WARN_THRESHOLD) {
            ring.style.stroke  = '#f4a118';
            counter.className  = 'counter-label warn';
            counter.textContent = remaining;
            banner.className   = 'limit-banner warn';
            banner.textContent = `Getting close — ${remaining} character${remaining === 1 ? '' : 's'} remaining.`;
        } else {
            ring.style.stroke  = '#1d9bf0';
            counter.className  = 'counter-label';
            counter.textContent = remaining;
            banner.className   = 'limit-banner';
            banner.textContent = '';
        }

        // block typing past limit
        if (used > MAX) {
            textarea.value = textarea.value.slice(0, MAX);
            return;
        }

        // enable submit only when 1–200 chars (non-whitespace)
        submitBtn.disabled = used === 0 || textarea.value.trim().length === 0;
    }

    textarea.addEventListener('input', update);

    // prevent paste that would exceed the limit
    textarea.addEventListener('paste', () => setTimeout(update, 0));

    // clear textarea after successful form submit
    document.getElementById('postForm').addEventListener('submit', () => {
        setTimeout(() => { textarea.value = ''; update(); }, 0);
    });

    update(); // initialise
</script>
</body>
</html>
